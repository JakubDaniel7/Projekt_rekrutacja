{% extends "contacts/base.html" %}

{% block title %}Usuń kontakt{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm border-danger-subtle">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">
          <i class="bi bi-exclamation-triangle text-danger"></i> Usunąć kontakt?
        </h1>
        <p class="mb-1">Czy na pewno chcesz usunąć kontakt <strong>{{ object }}</strong>?</p>
        <p class="text-body-secondary small mb-4">
          {{ object.phone }} · {{ object.email }} · {{ object.city }}
        </p>

        <form method="post" class="d-flex justify-content-end gap-2">
          {% csrf_token %}
          <a href="{% url 'contacts:list' %}" class="btn btn-outline-secondary">Anuluj</a>
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash"></i> Usuń
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
